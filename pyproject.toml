[project]
name = "payments-utils-demo"
version = "0.1.0"
description = "Sample utility library used to demonstrate JFrog Artifactory + GitHub Actions build integration"
requires-python = ">=3.9"
readme = "README.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
