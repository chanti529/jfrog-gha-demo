name: Build, Test, and Publish (JFrog Demo)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Service-account auth — matches Visa's current pattern.
  # OIDC is a drop-in swap for JF_ACCESS_TOKEN once the pilot moves to it;
  # nothing else in this workflow changes.
  JF_URL: ${{ vars.JF_URL }}
  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

jobs:
  build-and-publish:
    # Hosted runner for the live demo. Visa's actual pipelines run:
    #   runs-on: [self-hosted, on-prem]
    # — same workflow, same steps, different label. Nothing else changes.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------
      # THE ONE LINE THAT CHANGES EVERYTHING
      # Authenticates the JFrog CLI using JF_URL / JF_ACCESS_TOKEN above.
      # No manual token handling, no curl scripts, no separate config step.
      # ---------------------------------------------------------------
      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      # ---- TAKE: resolve dependencies through Artifactory ----
      # This is the "take" half of last section's give/take pattern —
      # pip now resolves through your pypi-remote repo instead of
      # going straight to the public PyPI.
      - name: Configure pip to resolve through Artifactory
        run: jf pip-config --repo-resolve=pypi-remote

      - name: Install dependencies
        run: |
          pip install build pytest
          pip install -e .
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build package
        run: python -m build

      # ---- GIVE: publish the artifact, with build context attached ----
      # This is the "give" half — the artifact lands in Artifactory
      # already linked to the build that produced it.
      - name: Publish package to Artifactory
        run: jf rt upload "dist/*.whl" "pypi-local/payments-utils-demo/"

      - name: Collect environment info
        run: jf rt build-collect-env

      - name: Publish build info
        run: jf rt build-publish

      # ---- The bidirectional link developers actually feel ----
      - name: Job summary
        run: |
          echo "### JFrog Build Info" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build published: **payments-utils-demo / ${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "View in Artifactory: \`$JF_URL/ui/builds\`" >> "$GITHUB_STEP_SUMMARY"
